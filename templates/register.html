{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card-soft p-4">
<h3 class="mb-3">Create account</h3>
<form method="post">
  <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password (min 6 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
  <label class="form-label">I want to join as</label>
  <select class="form-select mb-3" name="role">
    <option value="citizen">Citizen - report civic issues</option>
    <option value="volunteer">Volunteer - help fix community issues</option>
  </select>
  <button class="btn btn-green w-100">Register</button>
</form><p class="mt-3 mb-0 small">Municipal admin accounts are created by the system administrator.</p>
</div></div></div>{% endblock %}
