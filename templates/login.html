{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card-soft p-4">
<h3 class="mb-3">Login</h3>
<form method="post">
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required autofocus>
  <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
  <button class="btn btn-navy w-100">Login</button>
</form><p class="mt-3 mb-0 small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div></div>{% endblock %}
